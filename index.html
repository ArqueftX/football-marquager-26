<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football MARQnager 26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00e87a;
      --green-dim: #00b85f;
      --bg: #080e0b;
      --bg2: #0d1a12;
      --bg3: #132018;
      --card: #111c16;
      --border: #1f3028;
      --text: #e8f5ee;
      --muted: #6b8f78;
      --accent: #00e87a;
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ——— PITCH TEXTURE ——— */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 48px,
          rgba(0,232,122,0.025) 48px,
          rgba(0,232,122,0.025) 96px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ——— HEADER ——— */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(8,14,11,0.9);
      backdrop-filter: blur(8px);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .logo span { color: var(--green); }

    .logo-sub {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ——— CAREER NAV ——— */
    .career-nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 2.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .career-nav::-webkit-scrollbar { display: none; }

    .career-tab {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
    }
    .career-tab:hover { color: var(--text); }
    .career-tab.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }
    .career-tab .badge {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 20px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .career-tab.active .badge {
      background: rgba(0,232,122,0.12);
      border-color: rgba(0,232,122,0.3);
      color: var(--green);
    }

    /* ——— MAIN ——— */
    main {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 2rem 4rem;
    }

    .career-page { display: none; }
    .career-page.active { display: block; }

    /* Career header */
    .career-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .career-club {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.5rem;
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .career-club .highlight { color: var(--green); }
    .career-meta {
      text-align: right;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .career-meta strong {
      display: block;
      font-size: 1.4rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    /* Season grid */
    .seasons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .season-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem 1.2rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }
    .season-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--green) 0%, transparent 100%);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }
    .season-card:hover {
      border-color: rgba(0,232,122,0.4);
      background: var(--bg3);
      transform: translateY(-2px);
    }
    .season-card:hover::before { transform: scaleX(1); }

    .season-year {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      line-height: 1;
      color: var(--green);
      letter-spacing: 0.02em;
    }
    .season-label {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2px;
      margin-bottom: 1rem;
    }
    .season-desc {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.5;
      opacity: 0.7;
    }
    .season-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 1rem;
    }
    .tag {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .tag-promo { background: rgba(0,232,122,0.15); color: var(--green); border: 1px solid rgba(0,232,122,0.3); }
    .tag-titre { background: rgba(255,200,0,0.12); color: #ffd040; border: 1px solid rgba(255,200,0,0.3); }
    .tag-releg { background: rgba(220,60,60,0.15); color: #ff7070; border: 1px solid rgba(220,60,60,0.3); }
    .tag-coupe { background: rgba(100,160,255,0.12); color: #80b4ff; border: 1px solid rgba(100,160,255,0.3); }
    .tag-neutre { background: rgba(107,143,120,0.15); color: var(--muted); border: 1px solid var(--border); }

    .season-arrow {
      position: absolute;
      bottom: 1rem; right: 1rem;
      font-size: 1.1rem;
      color: var(--muted);
      transition: color 0.2s, transform 0.2s;
    }
    .season-card:hover .season-arrow {
      color: var(--green);
      transform: translate(2px, -2px);
    }

    /* ——— MODAL ——— */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(5,10,7,0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-bg.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      padding: 2rem;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.25s ease;
      position: relative;
    }
    .modal-bg.open .modal { transform: translateY(0) scale(1); }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 30px; height: 30px;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, background 0.2s;
    }
    .modal-close:hover { color: var(--text); background: var(--border); }

    .modal-season {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--green);
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .modal-club {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }
    .modal-summary {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.7;
      padding: 1rem;
      background: var(--bg3);
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ——— EMPTY STATE ——— */
    .empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .empty p { font-size: 0.9rem; }

    @media (max-width: 600px) {
      header { padding: 1rem 1.25rem; }
      .logo { font-size: 1.5rem; }
      .career-nav { padding: 0 1rem; }
      main { padding: 1.5rem 1rem 3rem; }
      .career-club { font-size: 2.5rem; }
      .seasons-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ======= DONNÉES — MODIFIE ICI ======= -->
<script>
const CAREERS = [
  {
    id: "chateauroux",
    club: "Châteauroux",
    ligue: "Ligue 2",
    debut: "2026",
    seasons: [
      {
        year: "2026-27",
        desc: "Première saison, montée surprise en fin de course.",
        tags: ["promo"]
      },
      {
        year: "2027-28",
        desc: "Consolidation difficile, coupe de France mémorable.",
        tags: ["coupe"]
      }
    ]
  }
  /* ——— AJOUTE UNE NOUVELLE CARRIÈRE ICI ——— */
  /* ,{
    id: "psg",
    club: "Paris SG",
    ligue: "Ligue 1",
    debut: "2028",
    seasons: [
      { year: "2028-29", desc: "Domination totale, triplé historique.", tags: ["titre"] }
    ]
  } */
];
/* TYPES DE TAGS : "promo" | "titre" | "releg" | "coupe" | "neutre" */
</script>
<!-- ======= FIN DES DONNÉES ======= -->

<header>
  <div>
    <div class="logo">Football <span>MARQ</span>nager <span>26</span></div>
    <div class="logo-sub">Mes carrières · FM 26</div>
  </div>
  <div style="font-size:0.75rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; text-align:right; display:none;" id="header-info"></div>
</header>

<nav class="career-nav" id="career-nav" role="tablist" aria-label="Sélection de carrière"></nav>

<main>
  <div id="career-pages"></div>
</main>

<div class="modal-bg" id="modal-bg" role="dialog" aria-modal="true" aria-labelledby="modal-season-year">
  <div class="modal">
    <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
    <div class="modal-season" id="modal-season-year"></div>
    <div class="modal-club" id="modal-club"></div>
    <div class="modal-summary" id="modal-summary"></div>
    <div class="modal-tags" id="modal-tags"></div>
  </div>
</div>

<script>
const TAG_LABELS = {
  promo: ["tag-promo", "↑ Promotion"],
  titre: ["tag-titre", "★ Titre"],
  releg: ["tag-releg", "↓ Relégation"],
  coupe: ["tag-coupe", "🏆 Coupe"],
  neutre: ["tag-neutre", "Saison"]
};

function renderTag(type) {
  const [cls, label] = TAG_LABELS[type] || TAG_LABELS.neutre;
  const el = document.createElement("span");
  el.className = "tag " + cls;
  el.textContent = label;
  return el;
}

function openModal(season, clubName) {
  document.getElementById("modal-season-year").textContent = season.year;
  document.getElementById("modal-club").textContent = clubName;
  document.getElementById("modal-summary").textContent = season.desc;
  const tagsEl = document.getElementById("modal-tags");
  tagsEl.innerHTML = "";
  (season.tags || []).forEach(t => tagsEl.appendChild(renderTag(t)));
  document.getElementById("modal-bg").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal-bg").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-bg").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-bg")) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// Build UI
const nav = document.getElementById("career-nav");
const pages = document.getElementById("career-pages");

CAREERS.forEach((career, i) => {
  // Tab
  const tab = document.createElement("button");
  tab.className = "career-tab" + (i === 0 ? " active" : "");
  tab.setAttribute("role", "tab");
  tab.setAttribute("aria-selected", i === 0 ? "true" : "false");
  tab.innerHTML = `${career.club} <span class="badge">${career.seasons.length} saison${career.seasons.length > 1 ? "s" : ""}</span>`;
  tab.addEventListener("click", () => switchCareer(career.id));
  nav.appendChild(tab);

  // Page
  const page = document.createElement("div");
  page.className = "career-page" + (i === 0 ? " active" : "");
  page.id = "page-" + career.id;

  const header = document.createElement("div");
  header.className = "career-header";
  header.innerHTML = `
    <div>
      <div class="career-club">${career.club.replace(/(\w+)$/, '<span class="highlight">$1</span>')}</div>
      <div style="font-size:0.75rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:6px;">${career.ligue}</div>
    </div>
    <div class="career-meta">
      <strong>${career.seasons.length}</strong>
      saison${career.seasons.length > 1 ? "s" : ""} jouée${career.seasons.length > 1 ? "s" : ""}
    </div>
  `;

  const grid = document.createElement("div");
  grid.className = "seasons-grid";

  if (career.seasons.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">⚽</div><p>Aucune saison enregistrée.</p></div>`;
  } else {
    career.seasons.forEach(season => {
      const card = document.createElement("div");
      card.className = "season-card";
      card.setAttribute("tabindex", "0");
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `Saison ${season.year} — ${season.desc}`);

      const tagsHTML = (season.tags || []).map(t => {
        const [cls, label] = TAG_LABELS[t] || TAG_LABELS.neutre;
        return `<span class="tag ${cls}">${label}</span>`;
      }).join("");

      card.innerHTML = `
        <div class="season-year">${season.year}</div>
        <div class="season-label">Saison</div>
        <div class="season-desc">${season.desc}</div>
        <div class="season-tags">${tagsHTML}</div>
        <span class="season-arrow" aria-hidden="true">↗</span>
      `;

      card.addEventListener("click", () => openModal(season, career.club));
      card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openModal(season, career.club); });
      grid.appendChild(card);
    });
  }

  page.appendChild(header);
  page.appendChild(grid);
  pages.appendChild(page);
});

function switchCareer(id) {
  document.querySelectorAll(".career-tab").forEach((tab, i) => {
    const active = CAREERS[i].id === id;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", active ? "true" : "false");
  });
  document.querySelectorAll(".career-page").forEach(p => {
    p.classList.toggle("active", p.id === "page-" + id);
  });
}
</script>
</body>
</html>
